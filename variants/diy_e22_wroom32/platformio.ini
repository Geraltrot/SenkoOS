; ===========================================================================
;  DIY repeater: ESP32 DevKit V1 30-pin (WROOM-32, 4 MB, no PSRAM)
;                + EBYTE E22-900M30S (SX1262 + 1 W PA, VCC = +5 V)
;                + OLED 128x128 SH1107 on I2C
;
;  Pin map checked against the board netlist (DIY_Meshtastic, Altium ECO log
;  29.01.2026). E22 DIO2 is not connected on this PCB; TXEN/RXEN are driven
;  by MCU GPIOs, so SX126X_DIO2_AS_RF_SWITCH must stay undefined.
; ===========================================================================

[DIY_E22_WROOM32]
extends = esp32_base
board = esp32doit-devkit-v1
; min_spiffs: 2 x 1.9 MB app slots (OTA) + small FS. Same layout as the
; firmware already on the device, so identity/prefs survive reflashing.
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/diy_e22_wroom32
  -D DIY_E22_WROOM32
  ; --- radio: SX1262 inside E22-900M30S ---
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D USE_SX1262
  -D P_LORA_NSS=18
  -D P_LORA_SCLK=5
  -D P_LORA_MOSI=27
  -D P_LORA_MISO=19
  -D P_LORA_RESET=23
  -D P_LORA_BUSY=32
  -D P_LORA_DIO_1=33
  -D SX126X_TXEN=13
  -D SX126X_RXEN=14
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; 22 dBm from the SX1262 = ~30 dBm at the E22 output. Never go higher.
  -D SX126X_MAX_POWER=22
  -D LORA_TX_POWER=22
  ; --- default radio profile (used only until prefs are saved on the device) ---
  -D LORA_FREQ=868.918
  -D LORA_BW=62.5
  -D LORA_SF=9
  -D LORA_CR=7
  ; --- board ---
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=22
  -D PIN_USER_BTN=39          ; input-only GPIO, external pull-up R1, active-low
  -D P_LORA_TX_LED=2          ; DevKit on-board LED
  ; no battery divider on this PCB: PIN_VBAT_READ intentionally undefined
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/diy_e22_wroom32>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SH110X @ ^2.1.6

; ---------------------------------------------------------------------------
;  Repeater settings shared by both builds below. Change the admin password
;  from the CLI after the first flash:  password <new>
; ---------------------------------------------------------------------------
[DIY_E22_WROOM32_repeater_common]
extends = DIY_E22_WROOM32
build_flags =
  ${DIY_E22_WROOM32.build_flags}
  -D DISPLAY_CLASS=SH1107Display
  -D DIY_BOARD_NAME='"SenkoPhone 1.0"'
  -D DIY_BOARD_ID='"e22wroom"'
; auto-update: manifest URL and the Ed25519 public key of the release signing key (not a secret).
; Empty = the updater reports "no signing key" / "no update url" and does nothing.
  -D DIY_UPDATE_URL='"https://github.com/Geraltrot/SenkoOS/releases/latest/download/manifest.json"'
  -D DIY_UPDATE_PUBKEY='"0f6346c81289c09d1d80fbafaa82bb4d1b69b79645a2b75acfe0ba6a5d759835"'
  -D ADVERT_NAME='"SenkoPhone"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
; I2C sensors on the OLED bus (SDA 21 / SCL 22): found at boot, values go to MQTT / HA, the panel and
; MeshCore telemetry. Nothing connected = nothing reported.
  -D DIY_ENV_SENSORS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_BMP085=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_INA3221=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${DIY_E22_WROOM32.lib_deps}
  ${esp32_ota.lib_deps}
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  adafruit/Adafruit BMP085 Library @ ^1.2.4
  adafruit/Adafruit SHTC3 Library @ ^1.0.1
  sensirion/Sensirion I2C SHT4x @ ^1.1.2
  arduino-libraries/Arduino_LPS22HB @ ^1.0.2
  adafruit/Adafruit INA219 @ ^1.2.3
  robtillaart/INA226 @ ^0.6.4
  adafruit/Adafruit INA260 Library @ ^1.5.3
  adafruit/Adafruit INA3221 Library @ ^1.0.1

; Main firmware: upstream repeater + Wi-Fi + local web panel (diy/firmware).
[env:DIY_E22_WROOM32_repeater]
extends = DIY_E22_WROOM32_repeater_common
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:diy/scripts/embed_web.py
  pre:diy/scripts/version.py
build_flags =
  ${DIY_E22_WROOM32_repeater_common.build_flags}
  -I examples/simple_repeater
  -I diy/firmware
build_src_filter = ${DIY_E22_WROOM32.build_src_filter}
  +<../examples/simple_repeater/MyMesh.cpp>
  +<../diy/firmware/*.cpp>
  +<helpers/ui/SH1107Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/sensors/EnvironmentSensorManager.cpp>

; Fallback: plain upstream simple_repeater, no Wi-Fi / web panel.
[env:DIY_E22_WROOM32_repeater_noweb]
extends = DIY_E22_WROOM32_repeater_common
build_src_filter = ${DIY_E22_WROOM32.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
  +<helpers/ui/SH1107Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/sensors/EnvironmentSensorManager.cpp>
