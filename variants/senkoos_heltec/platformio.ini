; ===========================================================================
;  SenkoOS on Heltec WiFi LoRa 32 V3 and V4 (ESP32-S3 + SX1262, OLED 128x64 SSD1306)
;
;  Built on top of the upstream variants (variants/heltec_v3, variants/heltec_v4),
;  which are NOT modified here: pins, radio, display, button and battery come from
;  them; this file only adds the SenkoOS application (diy/firmware) and its settings.
;
;  Partitions differ from the stock MeshCore builds (they use a 1.25 MB app slot,
;  SenkoOS is ~1.6 MB), so the first flash must be <tag>-<board>-merged.bin over USB
;  at 0x0. It erases the stock identity and settings: see diy/FLASHING.md.
; ===========================================================================

; SenkoOS application settings shared by the Heltec builds
[senkoos_heltec_app]
build_flags =
  -I examples/simple_repeater
  -I diy/firmware
  -D DISPLAY_CLASS=SSD1306Display
  -D DIY_HAS_BATTERY=1
  -D DIY_AP_PREFIX='"SenkoOS-Setup"'
; auto-update: Ed25519 public key of the release signing key (not a secret), same as SenkoPhone
  -D DIY_UPDATE_PUBKEY='"0f6346c81289c09d1d80fbafaa82bb4d1b69b79645a2b75acfe0ba6a5d759835"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
; I2C sensors: the upstream Heltec variants already enable them (sensor_base)
  -D DIY_ENV_SENSORS=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:diy/scripts/embed_web.py
  pre:diy/scripts/version.py
src_filter_app =
  +<../examples/simple_repeater/MyMesh.cpp>
  +<../diy/firmware/*.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>

; Heltec WiFi LoRa 32 V3: 8 MB flash, SX1262 without an external PA (22 dBm max)
[env:SenkoOS_heltec_v3_repeater]
extends = Heltec_lora32_v3
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
extra_scripts = ${senkoos_heltec_app.extra_scripts}
build_flags =
  ${Heltec_lora32_v3.build_flags}
  ${senkoos_heltec_app.build_flags}
  -D DIY_BOARD_NAME='"Heltec V3"'
  -D DIY_BOARD_ID='"heltec_v3"'
  -D DIY_UPDATE_URL='"https://github.com/Geraltrot/SenkoOS/releases/latest/download/manifest-heltec_v3.json"'
  -D ADVERT_NAME='"SenkoOS V3"'
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  ${senkoos_heltec_app.src_filter_app}
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  ${esp32_ota.lib_deps}

; Heltec WiFi LoRa 32 V4 (OLED): 16 MB flash, SX1262 + front-end PA.
; V4.2 (GC1109) and V4.3 (KCT8103L) are told apart at boot by the upstream board code.
; LORA_TX_POWER=10 (SX1262) gives ~22 dBm at the antenna; the SX1262 itself stops at 22.
[env:SenkoOS_heltec_v4_repeater]
extends = heltec_v4_oled
extra_scripts = ${senkoos_heltec_app.extra_scripts}
build_flags =
  ${heltec_v4_oled.build_flags}
  ${senkoos_heltec_app.build_flags}
  -D DIY_BOARD_NAME='"Heltec V4"'
  -D DIY_BOARD_ID='"heltec_v4"'
  -D DIY_UPDATE_URL='"https://github.com/Geraltrot/SenkoOS/releases/latest/download/manifest-heltec_v4.json"'
  -D ADVERT_NAME='"SenkoOS V4"'
build_src_filter = ${heltec_v4_oled.build_src_filter}
  ${senkoos_heltec_app.src_filter_app}
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${esp32_ota.lib_deps}
