name: build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    runs-on: self-hosted
    env:
      PIO_ENV: DIY_E22_WROOM32_repeater
      # release builds carry the tag as DIY_VERSION; other builds use git describe
      DIY_VERSION: ${{ github.event_name == 'release' && github.ref_name || '' }}
      # release channel shown in the panel: published release, pre-release (beta) or anything else (dev)
      DIY_CHANNEL: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'beta' || 'release') || 'dev' }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false

      # Personal markers (names, home coordinates, SSID) live in the repository variable
      # PRIVACY_PATTERNS (extended regex, "|"-separated), not in the code. Matches fail the build;
      # only file:line is printed so the data itself does not end up in the log.
      - name: Privacy check
        env:
          PATTERNS: ${{ vars.PRIVACY_PATTERNS }}
        run: |
          if [ -z "$PATTERNS" ]; then echo "::warning::PRIVACY_PATTERNS is not set, privacy check skipped"; exit 0; fi
          hits=$(grep -rnIiE -- "$PATTERNS" diy/firmware variants/diy_e22_wroom32 | cut -d: -f1,2 || true)
          if [ -n "$hits" ]; then echo "Personal data found at:"; echo "$hits"; exit 1; fi
          echo "privacy check: ok"

      - name: Versions
        run: pio --version && git --version

      - name: Build firmware.bin
        run: pio run -e "$PIO_ENV"

      - name: Build firmware-merged.bin
        run: pio run -e "$PIO_ENV" -t mergebin

      - name: Check outputs
        run: |
          cd ".pio/build/$PIO_ENV"
          ls -la firmware.bin firmware-merged.bin
          sha256sum firmware.bin firmware-merged.bin

      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/DIY_E22_WROOM32_repeater/firmware.bin
            .pio/build/DIY_E22_WROOM32_repeater/firmware-merged.bin

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # firmware.bin -> <tag>.bin, firmware-merged.bin -> <tag>-merged.bin
          for pair in "firmware.bin:$TAG.bin" "firmware-merged.bin:$TAG-merged.bin"; do
            src="${pair%%:*}"; name="${pair#*:}"
            curl -fsS -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@.pio/build/$PIO_ENV/$src" \
              "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets?name=$name"
          done

      # Auto-update manifest (diy/firmware/Updater.cpp): manifest.json + manifest.sig (Ed25519).
      # Secret UPDATE_SIGNING_KEY = PEM of the signing key; variable UPDATE_URL_BASE = where the
      # board downloads <tag>/<tag>.bin (GitHub: https://github.com/OWNER/REPO/releases/download).
      # Without the secret the step only warns: such releases are not offered to boards.
      - name: Update manifest
        if: github.event_name == 'release'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          URL_BASE: ${{ vars.UPDATE_URL_BASE }}
          CHANNEL: ${{ github.event.release.prerelease && 'beta' || 'release' }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$URL_BASE" ]; then
            echo "::warning::UPDATE_SIGNING_KEY or UPDATE_URL_BASE is not set: no update manifest for this release"
            exit 0
          fi
          python3 diy/scripts/make_manifest.py --tag "$TAG" --bin ".pio/build/$PIO_ENV/firmware.bin" \
            --board e22wroom --channel "$CHANNEL" --url-base "$URL_BASE" --out manifest.json
          umask 077
          key=$(mktemp); printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in manifest.json -out manifest.sig.bin
          rm -f "$key"
          od -An -tx1 -v manifest.sig.bin | tr -d ' \n' > manifest.sig
          test "$(wc -c < manifest.sig)" -eq 128
          for f in manifest.json manifest.sig; do
            curl -fsS -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" \
              "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets?name=$f"
          done

      # Public copy on GitHub (diy/scripts/publish_github.sh): one clean commit per release + GitHub
      # release with the firmware and the update manifest; the whole tree is checked against
      # PRIVACY_PATTERNS first. Secret GH_TOKEN (fine-grained, Contents RW, only that repo),
      # variable GH_REPO (owner/name). Without them the step only warns.
      - name: Publish to GitHub
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ vars.GH_REPO }}
          PATTERNS: ${{ vars.PRIVACY_PATTERNS }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ github.event.release.prerelease && 'true' || 'false' }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          BUILD_DIR: .pio/build/${{ env.PIO_ENV }}
        run: sh diy/scripts/publish_github.sh
